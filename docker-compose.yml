services:
  entitleguard:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Coolify magic variable: auto-assigns an FQDN from your wildcard domain
      # and routes it to port 3000 through the Coolify proxy (Traefik).
      - SERVICE_FQDN_ENTITLEGUARD_3000
      - ENTITLEGUARD_DB_PATH=/data/entitleguard.db
      # Set in Coolify env vars to enable the read-only /admin page
      # (Basic auth, user "admin"). Unset = /admin returns 404.
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # Monitoring beta endpoints remain disabled unless their tokens are set.
      - MONITORING_INGEST_TOKEN=${MONITORING_INGEST_TOKEN:-}
      - MONITORING_OPERATOR_TOKEN=${MONITORING_OPERATOR_TOKEN:-}
      - MONITORING_SCHEDULER_TOKEN=${MONITORING_SCHEDULER_TOKEN:-}
      # The scheduler calls one HTTPS source adapter for each active nightly job.
      - MONITORING_SOURCE_URL=${MONITORING_SOURCE_URL:-}
      - MONITORING_SOURCE_TOKEN=${MONITORING_SOURCE_TOKEN:-}
      # Comma-separated recipients. Resend is used through its HTTPS API.
      - MONITORING_ALERT_TO=${MONITORING_ALERT_TO:-}
      - MONITORING_ALERT_FROM=${MONITORING_ALERT_FROM:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - MONITORING_PUBLIC_URL=${MONITORING_PUBLIC_URL:-}
    volumes:
      # Persists leads, audit summaries, analytics events, monitoring history,
      # scheduler claims, and notification delivery records across deploys.
      - entitleguard-data:/data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  entitleguard-data:
